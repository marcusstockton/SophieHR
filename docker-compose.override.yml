services:
  sophiehr-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Run containerized API on HTTP only to avoid missing developer HTTPS cert inside the container.
      - ASPNETCORE_URLS=http://+:80
    ports:
      # Map container HTTP port 80 to host port used by compose (keep original mappings in docker-compose.yml)
      - "7188:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
